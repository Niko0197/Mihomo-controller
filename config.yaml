# --- ОСНОВНЫЕ ПОРТЫ ---
port: 7890
socks-port: 7891
mixed-port: 1080
redir-port: 1182
tproxy-port: 1181
allow-lan: true
mode: rule
log-level: silent
ipv6: false
tcp-concurrent: true
unified-delay: true
geo-auto-update: false
geo-update-interval: 168
external-controller: 0.0.0.0:9090
external-ui: ./zash
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip"
find-process-mode: off
profile: { store-selected: true }
sniffer: { enable: true, sniff: { HTTP: { ports: [80, 8080] }, TLS: { ports: [443, 8443] } }, skip-dst-address: [rule-set:telegram@ipcidr] }

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 127.0.0.1:1053
  nameserver:
    - 192.168.1.1
    - https://dns.google/dns-query

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400 }
  a4: &inline { type: inline, behavior: classical }

proxy-providers:
  stealthsurf:
    type: http
    url: "https://subscriptions.production.stealthsurfconnectivity.net/to/c316f1f5e54abbd3680fc445e048a3e1"
    interval: 300
    path: ./proxy_providers/stealthsurf.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30
      lazy: false
    header:
      User-Agent: ["Mozilla/5.0 (Linux; Android 14; Keenetic-Ultra-home) AppleWebKit/537.36 (KHTML, like Gecko) v2rayNG/1.8.12"]
      Device-Name: ["Keenetic Ultra home"]
      X-Device-Name: ["Keenetic Ultra home"]
      X-Device-Model: ["Keenetic-Ultra-home"]
      X-HWID: ["9D4B2C81E70FA356"]

  Igareck_Black_VPN:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt"
    interval: 3600
    path: ./proxy_providers/igareck_black.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30
      timeout: 4000
      lazy: false

proxies:
  - name: "⚡ NFQWS 1 (ТВ)"
    type: socks5
    server: 127.0.0.1
    port: 10805
    udp: true

  - name: "⚡ NFQWS 2 (Смартфон/ПК)"
    type: socks5
    server: 127.0.0.1
    port: 10806
    udp: true

proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - '🚀Auto-Best'
      - '⚙️Manual 1'
      - '⚙️Manual 2'
      - '⚙️Manual 3'
      - '💎 StealthSurf'
      - '🎱 GitHub'
      - DIRECT
      - REJECT

  - name: '🚀Auto-Best'
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 5
    proxies:
      - '💎 StealthSurf'
      - '🎱 GitHub'

  - name: '⚙️Manual 1'
    type: select
    use:
      - stealthsurf
      - Igareck_Black_VPN
    proxies:
      - DIRECT

  - name: '⚙️Manual 2'
    type: select
    use:
      - stealthsurf
      - Igareck_Black_VPN
    proxies:
      - DIRECT

  - name: '⚙️Manual 3'
    type: select
    use:
      - stealthsurf
      - Igareck_Black_VPN
    proxies:
      - DIRECT

  - name: '18+'
    type: select
    icon: https://www.svgrepo.com/show/330452/eighteen-plus.svg
    proxies: ['🚀Auto-Best', '⚙️Manual 1', '⚙️Manual 2', '⚙️Manual 3', DIRECT]

  - name: '💎 StealthSurf'
    type: fallback
    use:
      - stealthsurf
    url: http://www.gstatic.com/generate_204
    interval: 5

  - name: '🎱 GitHub'
    type: url-test
    use:
      - Igareck_Black_VPN
    url: http://www.gstatic.com/generate_204
    interval: 30
    tolerance: 50

